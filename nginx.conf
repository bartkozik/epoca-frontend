server {
  listen 80;

  access_log  off;

  location ${RESOURCE_PATH_PREFIX}/ {
    alias /usr/share/nginx/html/;
    include /etc/nginx/mime.types;
    try_files $uri $uri/ ${RESOURCE_PATH_PREFIX}/index.html;
  }

  # index.html (also reached through the SPA fallback and the directory index) and the runtime
  # env.js keep stable URLs across deployments, so browsers must revalidate them on every load.
  # Content-hashed bundles under static/ stay cacheable.
  location = ${RESOURCE_PATH_PREFIX}/index.html {
    alias /usr/share/nginx/html/index.html;
    include /etc/nginx/mime.types;
    add_header Cache-Control "no-cache" always;
  }

  location = ${RESOURCE_PATH_PREFIX}/assets/env.js {
    alias /usr/share/nginx/html/assets/env.js;
    include /etc/nginx/mime.types;
    add_header Cache-Control "no-cache" always;
  }

  location = ${RESOURCE_PATH_PREFIX}/frontend-version {
    alias /usr/share/nginx/html/frontend-version;
    default_type text/plain;
  }
}
