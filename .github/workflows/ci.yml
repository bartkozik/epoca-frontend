name: EPOCA frontend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  frontend:
    name: Frontend checks and image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: node .yarn/releases/yarn-4.18.0.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.0.cjs typecheck
      - run: node .yarn/releases/yarn-4.18.0.cjs typecheck:e2e
      - run: node .yarn/releases/yarn-4.18.0.cjs lint
      - run: node --test --test-concurrency=1 scripts/baseline-report.test.mjs scripts/e2e/coverage-validator.test.mjs scripts/e2e/coverage-cli.test.mjs
      - run: node .yarn/releases/yarn-4.18.0.cjs test --maxWorkers=2
      - name: Build public demo
        env:
          VITE_DEMO_ENABLED: 'true'
          VITE_API_BASE_URL: /api/v1
        run: node .yarn/releases/yarn-4.18.0.cjs vite build --base=/
      - name: Build and smoke test image
        run: |
          docker build -f Dockerfile.demo -t epoca-frontend:ci .
          docker run -d --name epoca-web-ci -p 8080:8080 --memory 64m --pids-limit 64 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m epoca-frontend:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/working-time | grep -q '<title>Epoca</title>'; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: docker save epoca-frontend:ci -o /tmp/epoca-frontend.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-image
          path: /tmp/epoca-frontend.tar
          retention-days: 2

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history -m' --redact --no-banner

  publish:
    needs: [frontend, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.push.outputs.web }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-image
          path: ${{ runner.temp }}
      - id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load -i "$RUNNER_TEMP/epoca-frontend.tar"
          image="ghcr.io/bartkozik/epoca-frontend:sha-$GITHUB_SHA"
          docker tag epoca-frontend:ci "$image"
          docker push "$image"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          digest=${reference##*@}
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'web=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: production
      url: https://epoca.kozikowski.it
    concurrency:
      group: epoca-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Deploy tested images
        env:
          WEB_DIGEST: ${{ needs.publish.outputs.web }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-demo.sh
